name: CI Quality & Smoke Gate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Asia/Shanghai
  PYTHONUTF8: "1"

jobs:
  lint-and-test:
    name: Ruff + Unit Tests + Headless Browser Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install package and dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Ruff static analysis
        run: ruff check .

      - name: Check frontend JavaScript syntax
        run: node --check web/app.js

      - name: Install Playwright headless Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run backend unit tests and frontend browser smoke tests
        env:
          RADAR_REQUIRE_BROWSER_SMOKE: "1"
          NO_PROXY: "127.0.0.1,localhost"
          no_proxy: "127.0.0.1,localhost"
        run: python -m unittest discover -s tests -v
