network:
  # 可选：代理地址（如 http://127.0.0.1:7897），也可通过环境变量 RADAR_PROXY 传入
  proxy: ""
  # 可选：读取 GitHub Token 的环境变量名（提升 Search/GraphQL 批量元信息补全的限流配额）
  github_token_env: "GITHUB_TOKEN"
  # max_enrich: 100
  # max_workers: 6

sources:
  github_trending:
    enabled: true
    languages:
      - ""        # 全语言总榜
    since: "daily"
    max_items: 30

  github_search:
    enabled: true
    queries:
      - name: "新锐黑马"
        days_created: 21
        days_pushed: 7
        min_stars: 50
        max_stars: 3000
        per_page: 25
      - name: "冷门宝藏"
        days_created: 14
        days_pushed: 5
        min_stars: 20
        max_stars: 400
        per_page: 35

  starred_users: []

  hackernews_show:
    enabled: true
    limit: 30

  hellogithub:
    enabled: true
    limit: 25

  huggingface_papers:
    enabled: true
    limit: 20

  github_releases:
    enabled: true
    repos:
      - "astral-sh/uv"
      - "ollama/ollama"

  reddit_rss:
    # 公共 Reddit .rss 在无代理云端常返回 404/429，默认关闭；配置代理或任意域名自建 RSSHub 后可开启
    enabled: false
    # 支持官方域名、任意域名自建 RSSHub（如 "https://rss.example.com" 或 "https://rss.example.com/reddit/subreddit"）或含 {subreddit} 占位符的模板
    rss_base_url: "https://www.reddit.com"
    subreddits:
      - "opensource"
      - "SideProject"
      - "selfhosted"

  extra_rss_urls: []

filters:
  require_programming_language: true
  drop_profile_readmes: true
  max_repo_age_years: 5
  anti_star_farm: true
  min_desc_chars: 6
  min_stars: 5
  # 白名单仓库（owner/repo），命中后跳过关键词/语言等常规去噪过滤
  whitelist_repos: []
  # 屏蔽高频刷榜或营销号作者/组织（owner）
  blacklist_owners: []
  blacklist_keywords:
    # 1. 资源合集 / 笔记路线图（英文短词自动按词边界匹配，避免误伤 virtual-list / garbage collection / kubernetes resources）
    - "awesome-"
    - "awesome-list"
    - "list of awesome"
    - "curated-list"
    - "curated list"
    - "reading-list"
    - "resource-list"
    - "cheat-sheet"
    - "cheatsheet"
    - "roadmap"
    - "link-collection"
    - "resource-collection"
    - "collection of links"
    - "bookmarks"
    - "learning-resources"
    - "study-resources"
    - "free-resources"
    - "合集"
    - "资源汇总"
    - "路线图"
    - "学习笔记"
    - "书单"
    - "导航"
    # 2. 面试八股 / 刷题
    - "interview"
    - "leetcode"
    - "system-design-primer"
    - "algorithm-notes"
    - "面试"
    - "八股"
    - "面经"
    - "校招"
    - "刷题"
    - "秋招"
    - "春招"
    - "真题"
    # 3. 纯教程 / 毕设模板
    - "tutorial"
    - "tutorials"
    - "for-beginners"
    - "100-days-of-"
    - "step-by-step"
    - "starter-template"
    - "从零开始"
    - "手把手"
    - "实战教程"
    - "毕设"
    - "课设"
    - "大作业"
    - "基于springboot"
    - "管理系统"
    # 4. AI Prompt / 套壳卖课引流
    - "prompts"
    - "chatgpt-prompts"
    - "claude-prompts"
    - "system-prompts"
    - "cursor-rules"
    - "ai-directory"
    - "ai-tools-list"
    - "gpt-nav"
    - "one-click-deploy"
    - "副业"
    - "变现"
    - "公众号"
    - "微信群"
    - "扫码"
    - "加群"
    - "领资料"
    - "日入"
    - "一键赚钱"
    # 5. 白嫖节点 / 盗版外挂壳仓 / 灰产脚本
    - "free-api"
    - "free-key"
    - "free-nodes"
    - "free-soft"
    - "free-download"
    - "pre-activated"
    - "proxy-pool"
    - "v2ray"
    - "clash"
    - "免费节点"
    - "自动签到"
    - "抢票"
    - "抢茅台"
    - "刷课"
    - "薅羊毛"
    - "jd_scripts"
    - "crack"
    - "cracked"
    - "keygen"
    - "aimbot"
    - "wallhack"
    - "hwid-spoofer"
    - "激活码"
    - "破解"

translation:
  enabled: true
  provider: "google_gtx"

ai_highlight:
  enabled: true
  # auto: 优先读取 OpenAI 兼容接口密钥（RADAR_AI_API_KEY），其次回退本地 agy CLI；无密钥时自动由本地确定性规则分类器兜底中文分类标签
  provider: "auto"
  base_url: "https://api.openai.com/v1"
  openai_model: "gpt-4o-mini"
  api_key_env: "RADAR_AI_API_KEY"
  agy_executable: "agy"
  model: "gemini-4-hydrogen-medium"
  max_batch_items: 25
  max_chunks_per_run: 8
  backfill_limit: 40
  timeout_seconds: 90

notifications:
  enabled: false
  # 支持 generic / feishu / dingtalk / wecom / discord / telegram
  provider: "generic"
  # 建议通过环境变量 RADAR_WEBHOOK_URL 传入，不要将密钥写死在配置里
  webhook_url: ""
  only_new: true
  min_sources: 1
  min_stars: 0
  top_n: 10
  max_category_share: 0.45
  languages: []
  keywords: []

output:
  max_feed_items: 120
  max_web_items: 300
  # 统一业务日期与快照时区（消除 GitHub Actions UTC 凌晨运行跨日错位；可通过 RADAR_TIMEZONE 覆盖）
  timezone: "Asia/Shanghai"
  # 单一主题在每屏/榜单中的配额上限（0.40 = 单类最多占 40%，防止 AI 刷屏淹没底层工具；设为 0 关闭）
  max_category_share: 0.40
  public_base_url: "http://localhost:8088/feeds"
