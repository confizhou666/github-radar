server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json application/feed+json application/xml text/xml image/svg+xml;

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    location = /llms.txt {
        alias /usr/share/nginx/feeds/llms.txt;
        default_type "text/plain; charset=utf-8";
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin "*";
    }

    location = /feeds.opml {
        alias /usr/share/nginx/feeds/feeds.opml;
        default_type "text/xml; charset=utf-8";
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin "*";
    }

    location /feeds/ {
        alias /usr/share/nginx/feeds/;
        autoindex on;
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin "*";
        types {
            application/xml xml opml;
            application/json json;
            text/plain txt;
            application/gzip gz;
        }
    }

    location ~* \.(?:css|js|svg|png|ico)$ {
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
