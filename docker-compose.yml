services:
  radar-web:
    image: nginx:alpine
    container_name: github-radar-web
    restart: unless-stopped
    ports:
      - "8088:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./feeds:/usr/share/nginx/feeds:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: 48m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

  radar-collector:
    image: python:3.12-alpine
    container_name: github-radar-collector
    profiles: ["collector"]
    restart: unless-stopped
    working_dir: /app
    environment:
      TZ: Asia/Shanghai
      PYTHONUTF8: "1"
      RADAR_INTERVAL_SECONDS: "86400"
    volumes:
      - ./radar:/app/radar:ro
      - ./run.py:/app/run.py:ro
      - ./config.yaml:/app/config.yaml:ro
      - ./requirements.txt:/app/requirements.txt:ro
      - ./data:/app/data
      - ./feeds:/app/feeds
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
      while true; do python run.py; sleep $${RADAR_INTERVAL_SECONDS:-86400}; done"
