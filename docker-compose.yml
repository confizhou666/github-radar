services:
  radar-web:
    image: nginx:alpine
    container_name: github-radar-web
    restart: unless-stopped
    ports:
      - "8088:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./feeds:/usr/share/nginx/feeds:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: 48m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"
