[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "github-radar"
version = "0.2.0"
description = "Zero-server daily GitHub discovery, anti-star-farm denoising, Chinese translation, and static optical ledger/RSS generator."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
  { name = "confizhou666" }
]
keywords = ["github", "trending", "rss", "json-feed", "llms-txt", "open-source", "curation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP :: Dynamic Content :: News/Diary",
  "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.8.0",
  "playwright>=1.49.0",
]

[project.urls]
Homepage = "https://confizhou666.github.io/github-radar/"
Repository = "https://github.com/confizhou666/github-radar"
Issues = "https://github.com/confizhou666/github-radar/issues"

[project.scripts]
github-radar = "run:main"

[tool.setuptools]
packages = ["radar"]
py-modules = ["run"]

[tool.ruff]
target-version = "py39"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501"]
